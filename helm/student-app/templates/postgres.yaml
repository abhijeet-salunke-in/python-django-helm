apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: {{ .Values.namespace.name }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

---
apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: {{ .Values.namespace.name }}

spec:
  selector:
    app: postgres

  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432

  type: ClusterIP